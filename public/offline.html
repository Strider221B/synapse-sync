<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>Offline — SynapseSync</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: rgba(20, 20, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      max-width: 520px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      display: inline-block;
    }
    .icon-container {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.5rem auto;
      border-radius: 1rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.1));
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }
    .action-btn {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      padding: 0.875rem;
      border-radius: 0.75rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9375rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .action-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge">
      <span class="badge-dot"></span> Offline Mode
    </div>
    <div class="icon-container">
      ⚡
    </div>
    <h1>You're Offline</h1>
    <p>
      Your cached notes and flashcards are still available from the home screen.
      You can continue studying offline without interruption.
    </p>

    <div class="nav-grid">
      <a href="/" class="nav-btn">🏠 Home</a>
      <a href="/notes" class="nav-btn">📚 Study Notes</a>
      <a href="/review" class="nav-btn">🧠 Daily Review</a>
      <a href="/quizzes" class="nav-btn">📝 Quizzes</a>
    </div>

    <button class="action-btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
</body>
</html>
